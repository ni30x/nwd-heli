# Android
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true

# Gradle daemon & parallelism
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Configuration cache (already beneficial; warn on incompatibilities)
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# JVM memory for Gradle daemon (raise if you have ≥16 GB RAM)
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Kotlin incremental compilation & caching
kotlin.incremental=true
kotlin.caching.enabled=true
kotlin.daemon.jvmargs=-Xmx2048m
